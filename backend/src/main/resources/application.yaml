server:
  port: 8081

spring:
  application:
    name: hung-huy-ecommerce-backend

  # 1. Kết nối PostgreSQL trên Render (hoặc fallback về local nếu chạy dưới máy tính)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hung_huy_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # 2. Cấu hình JPA / Hibernate cho PostgreSQL
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # 3. Cấu hình Flyway Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# 4. Cấu hình bảo mật App (JWT & Google OAuth)
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  google:
    client-id: 53160533409-59h5o3p9argpqnqh4nodojuakc9gfpdo.apps.googleusercontent.com

# 5. Cấu hình Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html