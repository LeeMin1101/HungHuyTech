server:
  port: 8081

spring:
  application:
    name: hung-huy-ecommerce-backend

  # 1. Kết nối MySQL trên Railway (hoặc fallback về local nếu chạy dưới máy tính)
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hung_huy_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 2. Cấu hình JPA / Hibernate cho MySQL
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # 3. Tắt Flyway Migration (vì database đã import sẵn cấu trúc & dữ liệu)
  flyway:
    enabled: false

# 4. Cấu hình bảo mật App (JWT & Google OAuth)
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION:86400000}
  google:
    client-id: 53160533409-59h5o3p9argpqnqh4nodojuakc9gfpdo.apps.googleusercontent.com

# 5. Cấu hình Swagger / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html